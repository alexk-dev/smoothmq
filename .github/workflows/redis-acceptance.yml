name: Redis SQS acceptance
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: go mod verify
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && govulncheck ./...
      - run: go vet ./... && go test -race ./...
      - run: go build -race -o /tmp/smoothmq-race .
      - run: python -m pip install boto3==1.43.116 botocore==1.43.116
      - run: python integration/critic_acceptance.py --binary /tmp/smoothmq-race --slow
