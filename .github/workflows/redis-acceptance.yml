name: Redis SQS acceptance
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test stage pins the same Redis release used by the persistence
      # regression, and runs module verification, vulnerability scanning,
      # vet, race tests, and the complete slow acceptance suite.
      - run: docker build --pull --target test --tag smoothmq:test .
